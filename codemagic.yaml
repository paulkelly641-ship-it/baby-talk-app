workflows:
  ios-workflow:
    name: My Baby Smarter
    instance_type: mac_mini_m2
    environment:
      groups: [appstore]
      vars:
        BUNDLE_ID: com.paulkelly.mybabysmarter
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22.12.0
      xcode: 26.2
      cocoapods: default
    scripts:
      - name: Build
        script: |
          npm ci || npm install
          echo '{"appId":"com.paulkelly.mybabysmarter","appName":"My Baby Smarter","webDir":"www"}' > capacitor.config.json
          if [ -f index.html ] && [ ! -d www ]; then mkdir -p www; cp index.html www/; fi
          npm run build || true
          rm -rf ios
          npx cap add ios
          npx cap sync ios
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER || echo "bump version $BUILD_NUMBER"
          cd ../..
      - name: Code Signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $BUNDLE_ID --type IOS_APP_STORE --create --certificate-key @env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: false
